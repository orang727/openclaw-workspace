<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挂起工单AI智能跟单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
        }
        
        /* 数据监控样式 */
        .date-picker {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-picker label {
            font-weight: 500;
        }
        .date-picker input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 250px);
            gap: 20px;
            justify-content: center;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 24px;
            color: #fff;
            text-align: center;
        }
        .stat-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-card.info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card.success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 导航标签 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 0;
        }
        .nav-tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            position: relative;
            transition: all 0.3s;
        }
        .nav-tab:hover {
            color: #667eea;
        }
        .nav-tab.active {
            color: #667eea;
            font-weight: 600;
        }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }
        
        /* 筛选和工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filters {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }
        .mode-toggle {
            display: flex;
            gap: 8px;
        }
        .mode-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        .mode-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }
        
        /* 列表和日志布局 */
        .content-area {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            min-height: 500px;
        }
        
        /* 任务列表 */
        .task-list {
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }
        .task-header {
            display: grid;
            grid-template-columns: 1.6fr 0.6fr 0.5fr 0.8fr 0.7fr 0.9fr 0.5fr 0.4fr 1.5fr 0.8fr 70px;
            padding: 12px 16px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #eee;
        }
        .task-header span:last-child {
            text-align: left;
        }
        .task-item {
            display: grid;
            grid-template-columns: 1.6fr 0.6fr 0.5fr 0.8fr 0.7fr 0.9fr 0.5fr 0.4fr 1.5fr 0.8fr 70px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .task-item > div:last-child {
            justify-content: flex-start;
        }
        .task-item:hover {
            background: #f8f9ff;
        }
        .task-item.selected {
            background: #eef2ff;
        }
        .task-name {
            font-weight: 500;
            color: #333;
        }
        .task-id {
            color: #888;
            font-family: monospace;
        }
        .task-time {
            color: #888;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-processing {
            background: #dbeafe;
            color: #2563eb;
        }
        .status-completed {
            background: #d1fae5;
            color: #059669;
        }
        .status-manual {
            background: #fce7f3;
            color: #db2777;
        }
        .status-error {
            background: #fee2e2;
            color: #dc2626;
        }
        .action-btn {
            padding: 6px 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn:hover {
            background: #5568d3;
        }
        .action-btn.disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 日志面板 */
        .log-panel {
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .log-header {
            padding: 12px 16px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }
        .log-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #2d2d2d;
        }
        .log-time {
            color: #858585;
            margin-right: 8px;
        }
        .log-info {
            color: #4ec9b0;
        }
        .log-warn {
            color: #dcdcaa;
        }
        .log-error {
            color: #f14c4c;
        }
        .log-success {
            color: #4ec9b0;
        }

        /* 详情页 */
        .detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .detail-header h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .detail-item {
            background: rgba(255,255,255,0.15);
            padding: 12px 16px;
            border-radius: 6px;
        }
        .detail-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 16px;
            font-weight: 500;
        }
        
        .detail-logs {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }
        .detail-logs-header {
            padding: 12px 16px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }
        .detail-log-content {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.8;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #f5f5f5;
        }
        
        /* 页面显示控制 */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 自动执行状态面板 */
        .batch-status-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            color: #fff;
        }
        .batch-status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .batch-status-icon {
            font-size: 20px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .batch-status-title {
            font-size: 16px;
            font-weight: 600;
        }
        .batch-progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .batch-progress-fill {
            height: 100%;
            background: #4ec9b0;
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .batch-status-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        .batch-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .batch-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .batch-stat.success { color: #4ec9b0; }
        .batch-stat.failed { color: #f14c4c; }
        .batch-stat.current { color: #fff; opacity: 0.9; }
        .batch-actions {
            display: flex;
            gap: 8px;
        }
        .batch-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .batch-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .batch-btn.stop {
            background: rgba(220, 53, 69, 0.8);
            border-color: rgba(220, 53, 69, 0.8);
        }
        .batch-btn.stop:hover {
            background: rgba(220, 53, 69, 1);
        }

        /* 确认弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .modal-icon {
            font-size: 24px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
        }
        .modal-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .modal-item:last-child {
            border-bottom: none;
        }
        .modal-label {
            color: #666;
            font-size: 14px;
        }
        .modal-value {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .modal-warning {
            background: #fef3c7;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #92400e;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.cancel {
            background: #fff;
            border: 1px solid #ddd;
            color: #666;
        }
        .modal-btn.cancel:hover {
            background: #f5f5f5;
        }
        .modal-btn.confirm {
            background: #667eea;
            border: 1px solid #667eea;
            color: #fff;
        }
        .modal-btn.confirm:hover {
            background: #5568d3;
        }
        .modal-btn.confirm:disabled {
            background: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>挂起工单AI智能跟单</h1>
        
        <!-- 导航标签 -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showPage('monitor')">数据监控</button>
            <button class="nav-tab" onclick="showPage('list')">跟单列表</button>
            <button class="nav-tab" onclick="showPage('sync')">数据同步</button>
        </div>
        
        <!-- 数据监控页面 -->
        <div id="page-monitor" class="page-section active">
            <div class="section">
                <div class="date-picker">
                    <label>选择日期：</label>
                    <input type="date" id="monitor-date" value="2026-03-25" onchange="updateMonitorData()">
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-processed">0</div>
                        <div class="stat-label">今日处理单量</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-value" id="stat-processing">0</div>
                        <div class="stat-label">处理中</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-value" id="stat-error">0%</div>
                        <div class="stat-label">异常率</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-value" id="stat-manual">0%</div>
                        <div class="stat-label">转人工率</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 列表页面 -->
        <div id="page-list" class="page-section">
            <div class="section">
                <div class="toolbar" style="flex-direction: column; align-items: stretch;">
                    <!-- 搜索条件区域 -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div class="date-picker" style="margin-bottom: 0;">
                            <label>发起日期：</label>
                            <input type="date" id="list-date" value="2026-03-25" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label>跟单内容：</label>
                            <select id="task-type-search" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-width: 120px;">
                                <option value="申请挂起">申请挂起</option>
                                <option value="">全部</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label>城市：</label>
                            <select id="city-search" disabled style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-width: 120px; background: #f5f5f5; cursor: not-allowed;">
                                <option value="360100">南昌</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label>任务ID：</label>
                            <input type="text" id="task-id-search" placeholder="输入任务ID查询" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 180px;">
                        </div>
                        <button class="action-btn" onclick="renderTaskList()" style="padding: 8px 20px; font-size: 14px;">搜索</button>
                    </div>
                    <!-- 状态筛选和模式切换 -->
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div class="filters">
                            <button class="filter-btn active" onclick="filterTasks('all', this)">全部</button>
                            <button class="filter-btn" onclick="filterTasks('pending', this)">待处理</button>
                            <button class="filter-btn" onclick="filterTasks('processing', this)">处理中</button>
                            <button class="filter-btn" onclick="filterTasks('completed', this)">已完成</button>
                            <button class="filter-btn" onclick="filterTasks('manual', this)">转人工</button>
                            <button class="filter-btn" onclick="filterTasks('error', this)">异常</button>
                        </div>
                        <div class="mode-toggle">
                            <button class="mode-btn" id="btn-auto" onclick="showAutoConfirm()">自动执行</button>
                            <button class="mode-btn active" id="btn-manual" onclick="setMode('manual')">手动执行</button>
                        </div>
                    </div>
                </div>

                <!-- 自动执行状态面板 -->
                <div id="batch-status-panel" class="batch-status-panel" style="display: none;">
                    <div class="batch-status-header">
                        <span class="batch-status-icon">🔄</span>
                        <span class="batch-status-title">自动执行中...</span>
                    </div>
                    <div class="batch-progress-bar">
                        <div class="batch-progress-fill" id="batch-progress-fill"></div>
                    </div>
                    <div class="batch-status-info">
                        <span id="batch-progress-text">0 / 0 (0%)</span>
                        <span id="batch-estimated-time">预计剩余: 计算中...</span>
                    </div>
                    <div class="batch-stats">
                        <span class="batch-stat success">成功: <span id="batch-success-count">0</span></span>
                        <span class="batch-stat failed">失败: <span id="batch-failed-count">0</span></span>
                        <span class="batch-stat current">当前: <span id="batch-current-task">-</span></span>
                    </div>
                    <div class="batch-actions">
                        <button class="batch-btn" id="btn-batch-pause" onclick="pauseBatch()">暂停</button>
                        <button class="batch-btn stop" onclick="stopBatch()">终止全部</button>
                    </div>
                </div>
                
                <div class="content-area">
                    <div class="task-list">
                        <div class="task-header">
                            <span>跟单ID</span>
                            <span>跟单内容</span>
                            <span>城市</span>
                            <span>发起时间</span>
                            <span>意向分类</span>
                            <span>意向内容</span>
                            <span>状态</span>
                            <span>执行</span>
                            <span>执行动作</span>
                            <span>完成时间</span>
                            <span>操作</span>
                        </div>
                        <div id="task-list-content">
                            <!-- 任务列表将通过JS渲染 -->
                        </div>
                    </div>
                    
                    <div class="log-panel">
                        <div class="log-header">实时执行日志</div>
                        <div class="log-content" id="log-content">
                            <!-- 日志内容将通过JS渲染 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 数据同步页面 -->
        <div id="page-sync" class="page-section">
            <div class="section">
                <div class="section-title">获取系统数据同步</div>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;">
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">数据环境</label>
                        <select id="sync-env" onchange="onEnvChange()" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px;">
                            <option value="test">测试环境</option>
                            <option value="prod">生产环境</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">城市</label>
                        <select id="sync-city" disabled style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px; background: #f5f5f5; cursor: not-allowed;">
                            <option value="360100">南昌</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">跟单内容ID *</label>
                        <input type="text" id="sync-content-id" value="1191" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">跟单状态</label>
                        <input type="text" id="sync-status" value="1" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">工单号</label>
                        <input type="text" id="sync-work-id" placeholder="可选" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">跟单类型</label>
                        <input type="text" id="sync-track-type" placeholder="可选，如1108,1107" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 150px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">跟单等级</label>
                        <input type="text" id="sync-track-level" placeholder="可选，如1,2" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 120px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">开始时间 *</label>
                        <input type="datetime-local" id="sync-start-time" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">结束时间 *</label>
                        <input type="datetime-local" id="sync-end-time" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: 500;">每页条数</label>
                        <input type="number" id="sync-page-size" value="10" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 80px;">
                    </div>
                    <button class="action-btn" onclick="queryData()" style="padding: 10px 30px; font-size: 14px; margin-bottom: 8px;">查询</button>
                    <button class="action-btn" onclick="doSyncData()" id="btn-sync" disabled style="padding: 10px 30px; font-size: 14px; margin-bottom: 8px; background: #ccc; cursor: not-allowed;">同步</button>
                </div>
                <div id="sync-result" style="margin-top: 20px; padding: 16px; border: 1px solid #eee; border-radius: 8px; display: none;">
                    <div id="sync-result-content"></div>
                </div>
            </div>
        </div>
        
        <!-- 详情页面 -->
        <div id="page-detail" class="page-section">
            <button class="back-btn" onclick="showPage('list')">← 返回列表</button>
            
            <div class="section">
                <div class="detail-header">
                    <h2>任务智能跟单详情</h2>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">跟单ID</div>
                            <div class="detail-value" id="detail-id">-</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">任务名称</div>
                            <div class="detail-value" id="detail-name">-</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">任务ID</div>
                            <div class="detail-value" id="detail-task-id">-</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">任务创建时间</div>
                            <div class="detail-value" id="detail-create-time">-</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">任务状态</div>
                            <div class="detail-value" id="detail-status">-</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">执行状态</div>
                            <div class="detail-value" id="detail-exec-status">-</div>
                        </div>
                    </div>
                </div>
                
                <div class="detail-logs">
                    <div class="detail-logs-header">完整执行日志</div>
                    <div class="detail-log-content" id="detail-log-content">
                        <!-- 完整日志将通过JS渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自动执行确认弹窗 -->
    <div id="auto-confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <span class="modal-title">确认自动执行</span>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <span class="modal-label">待执行数量</span>
                    <span class="modal-value" id="modal-total-count">加载中...</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">分批数量</span>
                    <span class="modal-value" id="modal-batch-count">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">预计时间</span>
                    <span class="modal-value" id="modal-est-time">-</span>
                </div>
                <div class="modal-warning">
                    ⚠️ 执行过程中请勿关闭页面<br>
                    ⚠️ 每个任务失败后会重试 2 次
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeAutoConfirm()">取消</button>
                <button class="modal-btn confirm" id="btn-confirm-auto" onclick="startAutoExecute()">确认执行</button>
            </div>
        </div>
    </div>

    <script>
        // API 基础地址
        const API_BASE = 'http://localhost:3001/api';

        // 数据
        let tasks = [];
        let currentLogs = [];
        let currentFilter = 'all';
        let currentMode = 'manual';
        let selectedTaskId = null;
        let batchPollInterval = null;

        // 显示自动执行确认弹窗
        async function showAutoConfirm() {
            // 获取待处理任务数量
            try {
                const res = await fetch(`${API_BASE}/batch/preview`);
                const result = await res.json();
                if (result.code === 0 && result.data) {
                    document.getElementById('modal-total-count').textContent = result.data.total_count + ' 条';
                    document.getElementById('modal-batch-count').textContent = result.data.batch_count + ' 批';
                    document.getElementById('modal-est-time').textContent = result.data.estimated_time;
                } else {
                    document.getElementById('modal-total-count').textContent = '获取失败';
                }
            } catch (err) {
                console.error('获取预览失败:', err);
                document.getElementById('modal-total-count').textContent = '获取失败';
            }

            document.getElementById('auto-confirm-modal').classList.remove('hidden');
        }

        // 关闭确认弹窗
        function closeAutoConfirm() {
            document.getElementById('auto-confirm-modal').classList.add('hidden');
        }

        // 开始自动执行
        async function startAutoExecute() {
            const btn = document.getElementById('btn-confirm-auto');
            btn.disabled = true;
            btn.textContent = '启动中...';

            try {
                const res = await fetch(`${API_BASE}/batch/start`, {
                    method: 'POST'
                });
                const result = await res.json();

                if (result.code === 0) {
                    closeAutoConfirm();
                    document.getElementById('batch-status-panel').style.display = 'block';
                    setMode('auto');
                    startBatchPolling();
                } else {
                    alert('启动失败: ' + result.message);
                }
            } catch (err) {
                console.error('启动自动执行失败:', err);
                alert('启动失败: ' + err.message);
            }

            btn.disabled = false;
            btn.textContent = '确认执行';
        }

        // 开始轮询批次状态
        function startBatchPolling() {
            if (batchPollInterval) clearInterval(batchPollInterval);

            batchPollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/batch/status`);
                    const result = await res.json();

                    if (result.code === 0 && result.data) {
                        if (!result.data.is_running) {
                            // 批次已结束
                            clearInterval(batchPollInterval);
                            batchPollInterval = null;
                            document.getElementById('batch-status-panel').style.display = 'none';
                            setMode('manual');
                            renderTaskList();

                            // 显示完成提示
                            if (result.data.last_batch) {
                                const last = result.data.last_batch;
                                alert(`自动执行已完成！\n成功: ${last.completed_count}\n失败: ${last.failed_count}`);
                            }
                            return;
                        }

                        // 更新状态面板
                        const data = result.data;
                        const progress = data.progress_percent || 0;
                        document.getElementById('batch-progress-fill').style.width = progress + '%';
                        document.getElementById('batch-progress-text').textContent =
                            `${data.current_index || 0} / ${data.total_count || 0} (${progress}%)`;
                        document.getElementById('batch-success-count').textContent = data.completed_count || 0;
                        document.getElementById('batch-failed-count').textContent = data.failed_count || 0;
                        document.getElementById('batch-current-task').textContent =
                            (data.current_task_id || '-').substring(0, 15) + '...';

                        // 更新暂停/恢复按钮
                        const pauseBtn = document.getElementById('btn-batch-pause');
                        if (data.is_paused) {
                            pauseBtn.textContent = '恢复';
                            pauseBtn.onclick = resumeBatch;
                        } else {
                            pauseBtn.textContent = '暂停';
                            pauseBtn.onclick = pauseBatch;
                        }

                        // 计算预计剩余时间
                        if (data.current_index > 0) {
                            const remaining = data.total_count - data.current_index;
                            const estMinutes = Math.round(remaining * 20 / 60);
                            document.getElementById('batch-estimated-time').textContent =
                                `预计剩余: ${estMinutes} 分钟`;
                        }
                    }
                } catch (err) {
                    console.error('轮询批次状态失败:', err);
                }
            }, 3000); // 每3秒轮询一次
        }

        // 暂停批量执行
        async function pauseBatch() {
            try {
                const res = await fetch(`${API_BASE}/batch/pause`, {
                    method: 'POST'
                });
                const result = await res.json();
                if (result.code !== 0) {
                    alert('暂停失败: ' + result.message);
                }
            } catch (err) {
                console.error('暂停失败:', err);
            }
        }

        // 恢复批量执行
        async function resumeBatch() {
            try {
                const res = await fetch(`${API_BASE}/batch/resume`, {
                    method: 'POST'
                });
                const result = await res.json();
                if (result.code !== 0) {
                    alert('恢复失败: ' + result.message);
                }
            } catch (err) {
                console.error('恢复失败:', err);
            }
        }

        // 停止批量执行
        async function stopBatch() {
            if (!confirm('确定要终止全部执行吗？已执行的任务状态会保留。')) return;

            try {
                const res = await fetch(`${API_BASE}/batch/stop`, {
                    method: 'POST'
                });
                const result = await res.json();
                if (result.code === 0) {
                    if (batchPollInterval) {
                        clearInterval(batchPollInterval);
                        batchPollInterval = null;
                    }
                    document.getElementById('batch-status-panel').style.display = 'none';
                    setMode('manual');
                    renderTaskList();
                    alert(`已终止！\n成功: ${result.data.completed_count}\n失败: ${result.data.failed_count}`);
                } else {
                    alert('停止失败: ' + result.message);
                }
            } catch (err) {
                console.error('停止失败:', err);
            }
        }

        // 页面切换
        function showPage(page) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');

            const tabIndex = page === 'monitor' ? 0 : page === 'list' ? 1 : page === 'sync' ? 2 : 0;
            document.querySelectorAll('.nav-tab')[tabIndex].classList.add('active');

            if (page === 'list') {
                renderTaskList();
                updateLogPanel('点击左侧任务查看日志');
                checkBatchStatus();
            } else if (page === 'detail' && selectedTaskId) {
                showTaskDetail(selectedTaskId);
            }
        }

        // 检查批次执行状态
        async function checkBatchStatus() {
            try {
                const res = await fetch(`${API_BASE}/batch/status`);
                const result = await res.json();
                if (result.code === 0 && result.data && result.data.is_running) {
                    document.getElementById('batch-status-panel').style.display = 'block';
                    startBatchPolling();
                } else {
                    document.getElementById('batch-status-panel').style.display = 'none';
                    if (batchPollInterval) {
                        clearInterval(batchPollInterval);
                        batchPollInterval = null;
                    }
                }
            } catch (err) {
                console.error('检查批次状态失败:', err);
            }
        }
        
        // 从 API 获取监控数据
        async function updateMonitorData() {
            const date = document.getElementById('monitor-date').value;
            try {
                const res = await fetch(`${API_BASE}/stats?date=${date}`);
                const result = await res.json();
                if (result.code === 0 && result.data) {
                    document.getElementById('stat-processed').textContent = result.data.processed_count || 0;
                    document.getElementById('stat-processing').textContent = result.data.processing_count || 0;
                    document.getElementById('stat-error').textContent = (result.data.error_rate || 0) + '%';
                    document.getElementById('stat-manual').textContent = (result.data.manual_rate || 0) + '%';
                }
            } catch (err) {
                console.error('获取监控数据失败:', err);
            }
        }
        
        // 从 API 获取任务列表
        async function fetchTasks() {
            const dateFilter = document.getElementById('list-date').value;
            const taskTypeFilter = document.getElementById('task-type-search').value;
            const cityFilter = document.getElementById('city-search').value;
            const taskIdSearch = document.getElementById('task-id-search').value.trim();
            
            let url = `${API_BASE}/tasks?`;
            if (dateFilter) url += `date=${dateFilter}&`;
            if (taskTypeFilter) url += `taskType=${encodeURIComponent(taskTypeFilter)}&`;
            if (cityFilter) url += `city=${encodeURIComponent(cityFilter)}&`;
            if (taskIdSearch) url += `taskId=${taskIdSearch}&`;
            if (currentFilter !== 'all') url += `status=${currentFilter}&`;
            
            try {
                const res = await fetch(url);
                const result = await res.json();
                if (result.code === 0) {
                    tasks = result.data;
                }
            } catch (err) {
                console.error('获取任务列表失败:', err);
                tasks = [];
            }
        }
        
        // 从 API 获取任务日志
        async function fetchTaskLogs(taskId) {
            try {
                const res = await fetch(`${API_BASE}/task/${taskId}`);
                const result = await res.json();
                if (result.code === 0) {
                    currentLogs = result.data.logs || [];
                    // 返回包含 id 的日志数组，用于增量轮询
                    return result.data.logs || [];
                }
            } catch (err) {
                console.error('获取日志失败:', err);
            }
            return [];
        }
        
        // 筛选任务
        function filterTasks(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTaskList();
        }
        
        // 设置执行模式
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'auto') {
                document.getElementById('btn-auto').classList.add('active');
                document.getElementById('btn-manual').classList.remove('active');
            } else {
                document.getElementById('btn-manual').classList.add('active');
                document.getElementById('btn-auto').classList.remove('active');
            }
        }
        
        // 渲染任务列表
        async function renderTaskList() {
            const container = document.getElementById('task-list-content');
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>加载中...</div></div>';
            
            await fetchTasks();
            
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div>暂无数据</div></div>';
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item ${selectedTaskId === task.track_id ? 'selected' : ''}" onclick="selectTask('${task.track_id}')">
                    <div class="task-id">${task.track_id}</div>
                    <div class="task-type">${task.task_type || '申请挂起'}</div>
                    <div class="task-city">${task.city || '—'}</div>
                    <div class="task-time">${task.create_time}</div>
                    <div class="task-category">${task.intent_category || '—'}</div>
                    <div class="task-intent">${task.intent_content || '—'}</div>
                    <div><span class="status-badge status-${task.status}">${getStatusText(task.status)}</span></div>
                    <div>${task.exec_status}</div>
                    <div class="task-action" title="${task.exec_action || ''}">${task.exec_action || '—'}</div>
                    <div class="task-complete-time">${task.complete_time || '—'}</div>
                    <div style="display: flex; gap: 4px; justify-content: flex-start;">
                        ${task.status === 'pending' ? '<button class="action-btn" onclick="event.stopPropagation(); executeTask(\'' + task.track_id + '\')">执行</button>' : ''}
                        ${task.status === 'processing' ? '<button class="action-btn" onclick="event.stopPropagation(); executeTask(\'' + task.track_id + '\')">重试</button>' : ''}
                        ${task.status === 'completed' ? '<button class="action-btn disabled" disabled>完成</button>' : ''}
                        ${task.status === 'error' ? '<button class="action-btn" onclick="event.stopPropagation(); executeTask(\'' + task.track_id + '\')">重试</button>' : ''}
                        <button class="action-btn" onclick="event.stopPropagation(); viewDetail('${task.track_id}')">详情</button>
                    </div>
                </div>
            `).join('');
            
            // 默认选中第一个
            if (tasks.length > 0 && !selectedTaskId) {
                await selectTask(tasks[0].track_id);
            }
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const map = {
                'pending': '待处理',
                'processing': '处理中',
                'completed': '已完成',
                'manual': '转人工',
                'error': '异常'
            };
            return map[status] || status;
        }
        
        // 选择任务
        async function selectTask(taskId) {
            selectedTaskId = taskId;
            await renderTaskList();
            const logs = await fetchTaskLogs(taskId);
            updateLogPanel(logs);
        }
        
        // 更新日志面板
        function updateLogPanel(logs) {
            const container = document.getElementById('log-content');
            if (!logs || (Array.isArray(logs) && logs.length === 0)) {
                container.innerHTML = '<div class="log-entry"><span class="log-info">暂无日志</span></div>';
                return;
            }

            // 支持数组和字符串两种格式
            let html = '';
            if (Array.isArray(logs)) {
                logs.forEach(log => {
                    const line = log.log_content || '';
                    let cls = 'log-info';
                    if (line.includes('[WARN]')) cls = 'log-warn';
                    if (line.includes('[ERROR]')) cls = 'log-error';
                    if (line.includes('[SUCCESS]')) cls = 'log-success';
                    html += `<div class="log-entry"><span class="${cls}">${line}</span></div>`;
                });
            } else {
                // 字符串格式（兼容旧代码）
                const lines = logs.split('\n');
                lines.forEach(line => {
                    let cls = 'log-info';
                    if (line.includes('[WARN]')) cls = 'log-warn';
                    if (line.includes('[ERROR]')) cls = 'log-error';
                    if (line.includes('[SUCCESS]')) cls = 'log-success';
                    html += `<div class="log-entry"><span class="${cls}">${line}</span></div>`;
                });
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }
        
        // 查看详情
        async function viewDetail(taskId) {
            selectedTaskId = taskId;
            showPage('detail');
        }
        
        // 执行任务
        async function executeTask(taskId) {
            if (!confirm('确定要立即执行该任务吗？')) return;

            try {
                // 清空日志面板，开始实时显示
                const logContainer = document.getElementById('log-content');
                logContainer.innerHTML = '<div class="log-entry"><span class="log-info">开始执行任务...</span></div>';
                let lastLogId = 0;
                let pollingCount = 0;
                const maxPollingCount = 150; // 最多轮询5分钟(150*2秒)

                // 启动轮询，获取实时日志
                const pollInterval = setInterval(async () => {
                    try {
                        const logs = await fetchTaskLogs(taskId);
                        const status = await fetchTaskStatus(taskId);

                        // 只显示新增的日志
                        const newLogs = logs.filter(log => log.id > lastLogId);
                        if (newLogs.length > 0) {
                            newLogs.forEach(log => {
                                const div = document.createElement('div');
                                div.className = 'log-entry';
                                const cls = log.log_level === 'error' ? 'log-error' :
                                           log.log_level === 'warn' ? 'log-warn' : 'log-info';
                                div.innerHTML = `<span class="${cls}">${log.log_content}</span>`;
                                logContainer.appendChild(div);
                            });
                            lastLogId = newLogs[newLogs.length - 1].id;
                            // 滚动到底部
                            logContainer.scrollTop = logContainer.scrollHeight;
                        }

                        pollingCount++;

                        // 任务完成或失败，停止轮询
                        if (status === 'completed' || status === 'error' || pollingCount >= maxPollingCount) {
                            clearInterval(pollInterval);
                            await renderTaskList();
                            if (pollingCount >= maxPollingCount) {
                                alert('执行超时，已停止轮询');
                            } else if (status === 'completed') {
                                alert('任务执行完成');
                            }
                        }
                    } catch (e) {
                        console.error('轮询日志失败:', e);
                    }
                }, 2000); // 每2秒轮询

                // 触发执行（异步，不等待结果）
                fetch(`${API_BASE}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trackId: taskId })
                }).catch(err => {
                    console.error('执行任务失败:', err);
                    clearInterval(pollInterval);
                    alert('执行失败: ' + err.message);
                });

            } catch (err) {
                console.error('执行任务失败:', err);
                alert('执行失败: ' + err.message);
            }
        }

        // 获取任务状态
        async function fetchTaskStatus(taskId) {
            try {
                const res = await fetch(`${API_BASE}/task/${taskId}`);
                const result = await res.json();
                if (result.code === 0 && result.data) {
                    return result.data.status;
                }
            } catch (e) {
                console.error('获取任务状态失败:', e);
            }
            return 'unknown';
        }
        
        // 暂存查询结果
        let queryResultData = [];
        
        // 环境切换时更新跟单内容ID
        function onEnvChange() {
            const env = document.getElementById('sync-env').value;
            const contentIdInput = document.getElementById('sync-content-id');
            // 测试环境默认1191，生产环境默认可能不同，这里保持1191
            contentIdInput.value = '1191';
        }
        
        // 查询数据
        async function queryData() {
            const env = document.getElementById('sync-env').value;
            const city = document.getElementById('sync-city').value;
            const contentId = document.getElementById('sync-content-id').value;
            const status = document.getElementById('sync-status').value;
            const workId = document.getElementById('sync-work-id').value;
            const trackType = document.getElementById('sync-track-type').value;
            const trackLevel = document.getElementById('sync-track-level').value;
            const startTime = document.getElementById('sync-start-time').value;
            const endTime = document.getElementById('sync-end-time').value;
            const pageSize = document.getElementById('sync-page-size').value;
            
            if (!contentId) {
                alert('请输入跟单内容ID');
                return;
            }
            if (!startTime || !endTime) {
                alert('请选择开始时间和结束时间');
                return;
            }
            
            const resultDiv = document.getElementById('sync-result');
            const resultContent = document.getElementById('sync-result-content');
            resultDiv.style.display = 'block';
            resultContent.innerHTML = '<div style="color: #666;">正在查询...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        env: env,
                        cityId: city,
                        trackContentIdList: contentId.split(',').map(s => parseInt(s.trim())),
                        trackStatusListStr: status,
                        code: workId ? parseInt(workId) : null,
                        trackTypeList: trackType ? trackType.split(',').map(s => parseInt(s.trim())) : null,
                        trackLevelList: trackLevel ? trackLevel.split(',').map(s => parseInt(s.trim())) : null,
                        startTime: startTime,
                        endTime: endTime,
                        pageSize: parseInt(pageSize) || 10,
                        pageIndex: 1
                    })
                });
                
                // 检查响应状态
                if (!res.ok) {
                    resultContent.innerHTML = '<div style="color: red;">❌ 查询失败：服务器错误 ' + res.status + '</div>';
                    return;
                }
                
                const text = await res.text();
                if (!text || text.trim() === '') {
                    resultContent.innerHTML = '<div style="color: red;">❌ 查询失败：服务器返回空响应</div>';
                    return;
                }
                
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    resultContent.innerHTML = '<div style="color: red;">❌ 查询失败：解析响应失败 - ' + e.message + '<br>原始响应：' + text.substring(0, 200) + '</div>';
                    return;
                }
                
                if (result.code === 0) {
                    queryResultData = result.data ? (result.data.items || []) : [];
                    const btnSync = document.getElementById('btn-sync');
                    if (queryResultData.length > 0) {
                        btnSync.disabled = false;
                        btnSync.style.background = '#28a745';
                        btnSync.style.cursor = 'pointer';
                    }
                    resultContent.innerHTML = `
                        <div style="margin-bottom: 15px;">✅ 查询成功！共 ${result.data.total} 条数据，请确认后点击"同步"按钮</div>
                        <div style="max-height: 300px; overflow-y: auto;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                                <tr style="background: #f5f5f5;">
                                    <th style="padding: 8px; border: 1px solid #ddd;">跟单ID</th>
                                    <th style="padding: 8px; border: 1px solid #ddd;">跟单内容</th>
                                    <th style="padding: 8px; border: 1px solid #ddd;">状态</th>
                                    <th style="padding: 8px; border: 1px solid #ddd;">发起时间</th>
                                </tr>
                                ${queryResultData.slice(0, 20).map(item => `
                                    <tr>
                                        <td style="padding: 8px; border: 1px solid #ddd;">${item.trackWorkId || '-'}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd;">${item.trackContent || '-'}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd;">${item.statusName || '-'}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd;">${item.createTime || '-'}</td>
                                    </tr>
                                `).join('')}
                                ${queryResultData.length > 20 ? `<tr><td colspan="4" style="padding: 8px; text-align: center; color: #666;">...还有 ${queryResultData.length - 20} 条未显示</td></tr>` : ''}
                            </table>
                        </div>
                    `;
                } else {
                    resultContent.innerHTML = `<div style="color: red;">❌ 查询失败：${result.message}</div>`;
                }
            } catch (err) {
                console.error('查询失败:', err);
                resultContent.innerHTML = `<div style="color: red;">❌ 查询失败：${err.message}</div>`;
            }
        }
        
        // 同步数据
        async function doSyncData() {
            if (queryResultData.length === 0) {
                alert('请先查询数据');
                return;
            }
            
            const resultDiv = document.getElementById('sync-result');
            const resultContent = document.getElementById('sync-result-content');
            resultContent.innerHTML = '<div style="color: #666;">正在同步...</div>';
            
            try {
                const city = document.getElementById('sync-city').value;
                const contentId = document.getElementById('sync-content-id').value;
                
                const res = await fetch(`${API_BASE}/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: queryResultData,
                        cityId: city,
                        trackContentIdList: contentId.split(',').map(s => parseInt(s.trim()))
                    })
                });
                const result = await res.json();
                if (result.code === 0) {
                    resultContent.innerHTML = `<div style="color: green;">✅ 同步成功！共同步 ${result.data.count} 条数据</div>`;
                    queryResultData = [];
                    // 刷新列表
                    renderTaskList();
                } else {
                    resultContent.innerHTML = `<div style="color: red;">❌ 同步失败：${result.message}</div>`;
                }
            } catch (err) {
                console.error('同步失败:', err);
                resultContent.innerHTML = `<div style="color: red;">❌ 同步失败：${err.message}</div>`;
            }
        }
        
        // 显示任务详情
        async function showTaskDetail(taskId) {
            const task = tasks.find(t => t.track_id === taskId);
            if (!task) {
                await fetchTasks();
            }

            const taskData = tasks.find(t => t.track_id === taskId);
            if (!taskData) return;

            document.getElementById('detail-id').textContent = taskData.track_id;
            document.getElementById('detail-name').textContent = taskData.task_name;
            document.getElementById('detail-task-id').textContent = taskData.task_id;
            document.getElementById('detail-create-time').textContent = taskData.create_time;
            document.getElementById('detail-status').textContent = getStatusText(taskData.status);
            document.getElementById('detail-exec-status').textContent = taskData.exec_status;

            // 获取完整日志
            const logs = await fetchTaskLogs(taskId);
            const logContainer = document.getElementById('detail-log-content');

            // 处理数组格式的日志
            let html = '';
            if (Array.isArray(logs)) {
                logs.forEach(log => {
                    const line = log.log_content || '';
                    let cls = 'log-info';
                    if (line.includes('[WARN]') || line.includes('⚠')) cls = 'log-warn';
                    if (line.includes('[ERROR]') || line.includes('❌')) cls = 'log-error';
                    if (line.includes('[SUCCESS]') || line.includes('✅')) cls = 'log-success';
                    if (line.includes('════════')) cls = 'log-info';
                    html += `<div class="log-entry"><span class="${cls}">${line}</span></div>`;
                });
            }
            logContainer.innerHTML = html || '<div class="log-entry"><span class="log-info">暂无日志</span></div>';
        }
        
        // 初始化
        updateMonitorData();
        renderTaskList();
        loadCities();
        
        // 加载城市列表
        async function loadCities() {
            try {
                const res = await fetch(`${API_BASE}/cities`);
                const result = await res.json();
                if (result.code === 0) {
                    const select = document.getElementById('sync-city');
                    select.innerHTML = result.data.map(c => 
                        `<option value="${c.city_id}">${c.city_name}</option>`
                    ).join('');
                    // 默认选中南昌
                    select.value = '360100';
                }
            } catch (err) {
                console.error('加载城市列表失败:', err);
            }
        }
    </script>
</body>
</html>
